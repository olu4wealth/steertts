// SteerTTS on Android: the C library (../../c) is compiled into the app's JNI library and the edge model is bundled
// as assets. The model is not in git: by default it is copied from ../c/models/steer-tts-edge (c/tools/get_models.sh),
// or pass -PsteerttsModel=/path/to/steer-tts-edge.
plugins {
    id "com.android.application"
}

def modelDir = file(project.findProperty("steerttsModel") ?: "../../c/models/steer-tts-edge")
def modelAssets = layout.buildDirectory.dir("generated/steertts-model")

// What a usable package contains: the engine opens all of these, and a partial download produces an
// APK that installs, registers as an engine and then fails at the first utterance.
def modelFiles = [
        "config.json": false,
        "acoustic.safetensors": false,
        "vocoder.safetensors": false,
        "voices.json": false,
        "voices.safetensors": false,
        "native/front/SYMBOLS.txt": false,
        "native/front/lexicon.bin": false,
        "native/front/gru.bin": false,
]

// The check is its own task on purpose. A Copy task whose source directory is missing has no
// source, so Gradle marks it NO-SOURCE and skips it - including its doFirst - which silently
// produced an APK with no model in it. A task with only doLast always runs.
tasks.register("validateSteerttsModel") {
    description = "Fails unless the SteerTTS model package is complete."
    doLast {
        def missing = modelFiles.keySet().findAll { !new File(modelDir, it).exists() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "no usable SteerTTS edge model in ${modelDir}\n" +
                    "  missing: ${missing.join(', ')}\n" +
                    "  fetch it with:  \$env:HF_TOKEN='hf_...'; python tools/fetch_model.py\n" +
                    "  or point at an existing package: -PsteerttsModel=DIR")
        }
    }
}

tasks.register("copySteerttsModel", Copy) {
    dependsOn "validateSteerttsModel"
    from(modelDir) {
        include "config.json", "acoustic.safetensors", "vocoder.safetensors", "voices.json", "voices.safetensors",
                "native/front/**"
    }
    into modelAssets.map { it.dir("model") }
}

android {
    namespace "ai.whissle.steertts.demo"
    compileSdk 36

    // NDK r27b (27.1.12297006) is the release upstream pins. Prefer a standalone NDK passed as
    // -PsteerttsNdk=<dir> (its revision is read from source.properties, because AGP rejects an
    // ndkPath whose revision disagrees with ndkVersion); otherwise use the SDK's own copy.
    def standaloneNdk = project.findProperty("steerttsNdk")
    if (standaloneNdk) {
        def ndkProps = new Properties()
        new File(standaloneNdk, "source.properties").withInputStream { ndkProps.load(it) }
        ndkVersion ndkProps.getProperty("Pkg.Revision")
        ndkPath standaloneNdk
    } else {
        ndkVersion "27.1.12297006"
    }
    buildToolsVersion "35.0.1"

    defaultConfig {
        applicationId "ai.whissle.steertts"      // the Play Store id (permanent); the code's namespace stays ai.whissle.steertts.demo
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName "1.8.5"
        resValue "string", "app_name", "SteerTTS"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake { arguments "-DANDROID_STL=none" }
        }
    }
    // Release key from ~/.gradle/gradle.properties (STEERTTS_STORE_FILE, ..._STORE_PASSWORD, ..._KEY_ALIAS,
    // ..._KEY_PASSWORD); without them the release build is signed with the debug key. Updates to an installed app must
    // be signed with the same key, so keep the keystore backed up.
    signingConfigs {
        if (project.hasProperty("STEERTTS_STORE_FILE")) {
            release {
                storeFile file(STEERTTS_STORE_FILE)
                storePassword STEERTTS_STORE_PASSWORD
                keyAlias STEERTTS_KEY_ALIAS
                keyPassword STEERTTS_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"           // installs next to the store app; demo-recording hooks work only here
            resValue "string", "app_name", "SteerTTS debug"
        }
        release {
            minifyEnabled false
            signingConfig project.hasProperty("STEERTTS_STORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    sourceSets {
        main { assets.srcDirs += modelAssets }
    }
    packaging {
        // compressed and extracted at install: AGP 8.2 aligns stored native libraries to 4 KB only, which phones with
        // 16 KB pages (Android 15+) refuse to map from the APK ("app isn't 16 KB compatible")
        jniLibs { useLegacyPackaging true }
    }
    androidResources {
        noCompress += ["safetensors", "bin", "json", "tsv", "txt"]   // copied once at first start, faster uncompressed
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true   // the speech logic is plain Java; android.* stubs are never called for real
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

tasks.named("preBuild") { dependsOn "copySteerttsModel" }
