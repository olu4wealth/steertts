org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
# Everything the build needs (platform 36, Build Tools 35.0.1, NDK r27b, CMake 3.22.1) is already
# installed. AGP's own SDK auto-download writes to %USERPROFILE%\.android\cache, which is not
# writable here, so turn it off: a missing component then fails fast with a clear message.
android.builder.sdkDownload=false

